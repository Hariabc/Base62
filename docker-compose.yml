version: '3.8'

services:
  # 1. PostgreSQL 16 Persistence Layer
  postgres:
    image: postgres:16-alpine
    container_name: base62-postgres
    restart: always
    environment:
      POSTGRES_DB: base62
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base62"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 Sub-Millisecond Caching & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: base62-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Spring Boot Backend Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: base62-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: base62
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BASE62_BASE_URL: http://localhost:8080
      AI_API_KEY: ${AI_API_KEY:-mock}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React Vite Dashboard & Nginx CDN
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: base62-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
